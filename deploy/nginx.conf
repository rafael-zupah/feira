# ─────────────────────────────────────────────────────────────────────────────
# Feira Cultural — bloco do Nginx
#
# Instalar assim, no VPS:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/feira.staging.veruh.com.br
#   sudo ln -s /etc/nginx/sites-available/feira.staging.veruh.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Este bloco é só HTTP. O HTTPS entra depois, com um comando:
#   sudo certbot --nginx -d feira.staging.veruh.com.br
# O certbot reescreve este arquivo, acrescentando o bloco 443 e o redirecionamento
# de http para https. Por isso ele não vem pronto aqui: um bloco 443 apontando
# para um certificado que ainda não existe faz o `nginx -t` falhar.
#
# O site é HTTPS por necessidade, não por capricho: sem cadeado, o navegador do
# celular trata a página como insegura e o QR code no estande perde credibilidade.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name feira.staging.veruh.com.br;

    # O Nginx serve a página sozinho: é mais rápido que passar pelo Node.
    # Só /api/ é que precisa do processo.
    root /var/www/html/feira/public;
    index index.html;

    # ─── Upload ──────────────────────────────────────────────────────────────
    # A foto chega reduzida pelo navegador (1024px, JPEG), o que dá algumas
    # centenas de KB. 4m é teto de segurança, não convite.
    client_max_body_size 4m;
    client_body_timeout  30s;

    # ─── Compressão ──────────────────────────────────────────────────────────
    gzip on;
    # O padrão do gzip_proxied é "off" e depende do cabeçalho Via; "any" garante
    # que as respostas do Node também sejam comprimidas.
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    # text/html não entra na lista: o nginx já o comprime sozinho, e repetir
    # aqui só gera o aviso "duplicate MIME type" no nginx -t.
    gzip_types application/json application/javascript text/css image/svg+xml;

    # ─── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        # SEM barra no fim. Com "http://127.0.0.1:8090/", o Nginx trocaria
        # /api/generate por /generate e o app responderia 404 em tudo.
        proxy_pass http://127.0.0.1:8090;

        # O padrão é HTTP/1.0 com "Connection: close", que abre uma conexão nova
        # a cada pedido.
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Real-IP é o que o app usa para contar o limite por pessoa.
        # $remote_addr e não $proxy_add_x_forwarded_for: este último ACRESCENTA ao
        # que o visitante mandou, então quem quisesse burlar o limite bastaria
        # enviar um X-Forwarded-For próprio.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Apaga o cabeçalho que a Cloudflare usaria. Num Nginx comum ele não
        # significa nada e, se sobrevivesse, o visitante poderia forjá-lo para
        # escapar do limite por IP. Valor vazio = cabeçalho removido.
        proxy_set_header CF-Connecting-IP  "";

        # Absorve o upload lento do celular no 4G antes de acordar o Node.
        proxy_request_buffering on;

        # ─── Tempo ───────────────────────────────────────────────────────────
        # Uma geração leva de 10 a 30 segundos. O proxy_read_timeout padrão é 60s
        # e, num dia de fila cheia, mataria a resposta no meio — o visitante
        # veria erro e a imagem seria cobrada do mesmo jeito.
        proxy_connect_timeout 5s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        send_timeout          180s;
    }

    # ─── Estático ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # No dia do evento, se for preciso corrigir a página, isto evita que o
    # celular do visitante continue com a versão velha em cache.
    location = /app.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
